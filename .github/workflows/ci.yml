name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DeskGrid.slnx -c Release

      - name: Test
        run: dotnet test DeskGrid.slnx -c Release --no-build

      - name: Publish single exe
        # With a -p:Version, as a release has: that is what once left BrimDeck.Core out of step with BrimDeck (the exe did not start).
        run: dotnet publish src/DeskGrid/DeskGrid.csproj -p:PublishProfile=win-x64 -p:Version=0.0.1

      - name: Smoke test (the published exe starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process artifacts/publish/DeskGrid.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "The published exe exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v7
        with:
          name: DeskGrid-win-x64
          path: artifacts/publish/DeskGrid.exe
          if-no-files-found: error
